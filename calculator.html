            <div class="calculator">
                <label for="electricity">Electricity Usage (kWh/month):</label>
<input type="number" id="electricity" required><br><br>

<input type="number" id="vehicle" required><br><br>

<label for="lpg">LPG Cylinders Used (per month):</label>
<input type="number" id="lpg" required><br><br>

<label for="transport">Public Transport (km/week):</label>
<input type="number" id="transport" required><br><br>

<button type="button" onclick="calculateFootprint()">
    Calculate
</button><br><br>

            <div class="result">
                <div id="result-box">
    <h2>Estimated Carbon Footprint</h2>

    <p id="result">Your result will appear here.</p>
